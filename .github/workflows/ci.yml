name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go build ./cmd/nebulakv
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nebulakv:ci .
      - name: redis-cli and restart compatibility
        run: bash scripts/docker-smoke.sh nebulakv:ci
